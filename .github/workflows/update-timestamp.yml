name: Auto Update Hub Metadata & Timestamps

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-metadata-and-sheets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Update only Loader feature blocks whose matching plugin/tool file changed.
      - name: Update matching feature blocks
        id: feature_update
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { execFileSync } = require('child_process');
          const loaderPath = 'Loader.lua';
          const sheetKeysPath = '/tmp/updated-badge-keys.txt';
          let changedFiles = [];
          try {
            changedFiles = execFileSync('git', ['diff', '--name-only', 'HEAD^', 'HEAD'], { encoding: 'utf8' })
              .split('\n').map(s => s.trim()).filter(Boolean);
          } catch (_) {
            changedFiles = execFileSync('git', ['show', '--pretty=', '--name-only', 'HEAD'], { encoding: 'utf8' })
              .split('\n').map(s => s.trim()).filter(Boolean);
          }

          let previousLoader = '';
          try { previousLoader = execFileSync('git', ['show', 'HEAD^:Loader.lua'], { encoding: 'utf8' }); } catch (_) {}
          const previousFeatureKeys = new Set();
          for (const oldBlock of (previousLoader.match(/\{[^{}]*\}/gs) || [])) {
            const oldRaw = (oldBlock.match(/RawUrl\s*=\s*"([^"]*)"/) || [])[1];
            const oldCmd = (oldBlock.match(/Cmd\s*=\s*"([^"]*)"/) || [])[1];
            if (oldRaw && oldCmd) previousFeatureKeys.add(`${oldRaw}_${oldCmd}`);
          }
          const candidates = changedFiles.filter(file =>
            file !== loaderPath && !file.startsWith('.github/') &&
            (file.endsWith('.lua') || !file.split('/').pop().includes('.'))
          );
          if (!candidates.length) {
            fs.writeFileSync(sheetKeysPath, '');
            console.log('No plugin/tool source files changed.');
            process.exit(0);
          }

          const now = new Date();
          const parts = new Intl.DateTimeFormat('en-GB', {
            timeZone: 'Asia/Jakarta', day: '2-digit', month: '2-digit', year: 'numeric',
            hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
          }).formatToParts(now).reduce((o, p) => (o[p.type] = p.value, o), {});
          const stamp = `${parts.day}${parts.month}${parts.year}${parts.hour}${parts.minute}, 86400`;
          let source = fs.readFileSync(loaderPath, 'utf8');
          let changed = false;
          const updatedKeys = new Set();

          function findBlockBounds(text, at) {
            let depth = 0, start = -1, end = -1, inString = false, escaped = false;
            for (let i = at; i >= 0; i--) {
              const c = text[i];
              if (c === '"' && !escaped) inString = !inString;
              if (!inString) {
                if (c === '}') depth++;
                else if (c === '{') {
                  if (depth === 0) { start = i; break; }
                  depth--;
                }
              }
              escaped = c === '\\' && !escaped;
              if (c !== '\\') escaped = false;
            }
            if (start < 0) return null;
            depth = 0; inString = false; escaped = false;
            for (let i = start; i < text.length; i++) {
              const c = text[i];
              if (c === '"' && !escaped) inString = !inString;
              if (!inString) {
                if (c === '{') depth++;
                else if (c === '}' && --depth === 0) { end = i; break; }
              }
              escaped = c === '\\' && !escaped;
              if (c !== '\\') escaped = false;
            }
            return end >= 0 ? { start, end } : null;
          }

          function upsertString(block, prop, value) {
            const escaped = value.replace(/\\/g, '\\\\').replace(/"/g, '\\"');
            const re = new RegExp(`(^|\\n)(\\s*)${prop}\\s*=\\s*"[^"]*"`, 'm');
            if (re.test(block)) return block.replace(re, (_m, nl, indent) => `${nl}${indent}${prop} = "${escaped}"`);
            return block.replace('{', ` {\n        ${prop} = "${escaped}",`.replace(/^ \{/, '{'));
          }

          for (const file of candidates) {
            const base = file.split('/').pop().replace(/\.lua$/i, '');
            console.log(`Checking changed source: ${file} (Loader RawUrl suffix: ${base})`);
            let searchFrom = 0;
            while (true) {
              const escapedBase = base.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const urlRe = new RegExp(`RawUrl\\s*=\\s*"[^"]*\\/${escapedBase}"`, 'g');
              urlRe.lastIndex = searchFrom;
              const match = urlRe.exec(source);
              if (!match) break;
              const bounds = findBlockBounds(source, match.index);
              if (!bounds) { searchFrom = match.index + match[0].length; continue; }
              let block = source.slice(bounds.start, bounds.end + 1);
              const raw = (block.match(/RawUrl\s*=\s*"([^"]*)"/) || [])[1];
              const cmd = (block.match(/Cmd\s*=\s*"([^"]*)"/) || [])[1];
              if (raw && cmd) {
                const key = `${raw}_${cmd}`;
                const isNew = !previousFeatureKeys.has(key);
                const badgeText = isNew ? 'New!' : 'Update!';
                const badgeColor = isNew ? 'yellow' : 'green';
                let updated = upsertString(block, 'UpdateTimestamp', stamp);
                updated = upsertString(updated, 'BadgeText', badgeText);
                updated = upsertString(updated, 'BadgeColor', badgeColor);
                // Setiap fitur yang cocok dengan file sumber harus direaktivasi.
                   updatedKeys.add(key);

              if (updated !== block) {
                source = source.slice(0, bounds.start) + updated + source.slice(bounds.end + 1);
                changed = true;
                searchFrom = bounds.start + updated.length;
                } else {
               searchFrom = bounds.end + 1;
              }
              } else {
                searchFrom = bounds.end + 1;
              }
            }
          }

          if (changed) fs.writeFileSync(loaderPath, source);
          fs.writeFileSync(sheetKeysPath, [...updatedKeys].join('\n'));
          console.log(`Updated ${updatedKeys.size} feature key(s).`);
          NODE

      - name: Commit Loader changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Loader.lua
          if ! git diff --cached --quiet; then
            git commit -m "bot: update feature badge timestamps"
            git push
          fi

      # Reactivate only the exact feature keys whose source files changed.
      - name: Reactivate updated feature badges
        env:
          SHEETS_WEB_APP_URL: https://script.google.com/macros/s/AKfycbxJzU3MiL_o9PjkF4h-prSw-P8vLVfJqGFXM7pFJOPzIzJXaGmu6z6oK0oJl54a6bQy0Q/exec
        run: |
          if [ -s /tmp/updated-badge-keys.txt ]; then
            while IFS= read -r key; do
              [ -z "$key" ] && continue
              UPDATED_AT=$(date +%s%3N)
              payload=$(jq -n --arg key "$key" --arg ts "$UPDATED_AT" '{Type:"FeatureUpdate", Key:$key, Timestamp:$ts}')
              curl -fsSL -X POST -H 'Content-Type: application/json' -d "$payload" "$SHEETS_WEB_APP_URL"
              echo
            done < /tmp/updated-badge-keys.txt

            CURRENT_TIME=$(TZ='Asia/Jakarta' date +'%d%m%Y %H:%M')
            payload=$(jq -n --arg ts "$CURRENT_TIME" '{Type:"LastUpdate", Timestamp:$ts}')
            curl -fsSL -X POST -H 'Content-Type: application/json' -d "$payload" "$SHEETS_WEB_APP_URL"
            echo
          else
            echo 'No matching feature block changed; LastUpdate left untouched.'
          fi
          
