name: Auto Update Hub Metadata & Timestamps (Dynamic & Key-Free)

on:
  push:
    branches:
      - main

jobs:
  update-metadata-and-sheets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository with History
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # 1. STEP DINAMIS UNTUK UPDATE LOADER.LUA (MENDUKUNG SHARED FEATURES & TAB)
      - name: Process Dynamic Timestamp & Badge Updates in Loader.lua
        run: |
          node -e '
            const fs = require("fs");
            const { execSync } = require("child_process");

            let changedFiles = [];
            try {
              changedFiles = execSync("git diff-tree --no-commit-id --name-only -r HEAD")
                .toString()
                .trim()
                .split("\n");
            } catch (e) {
              process.exit(0);
            }

            if (!changedFiles.length || (changedFiles.length === 1 && changedFiles[0] === "")) {
              console.log("Tidak ada perubahan file.");
              process.exit(0);
            }

            // Format Waktu WIB (UTC+7)
            const now = new Date();
            now.setHours(now.getHours() + 7);
            const pad = (n) => String(n).padStart(2, "0");
            const dd = pad(now.getDate());
            const mm = pad(now.getMonth() + 1);
            const yyyy = now.getFullYear();
            const hh = pad(now.getHours());
            const min = pad(now.getMinutes());
            const featureTimeStr = `${dd}${mm}${yyyy}${hh}${min}, 86400`;

            let loaderContent = fs.readFileSync("Loader.lua", "utf8");
            let modified = false;

            changedFiles.forEach((file) => {
              if (file === "Loader.lua" || file.includes("update.yml")) return;

              if (file.endsWith(".lua") || !file.includes(".")) {
                const rawName = file.split("/").pop();
                const cleanName = rawName.replace(".lua", "");

                console.log(`Mendeteksi perubahan pada file: ${cleanName}`);

                let isNewFile = false;
                try {
                  const status = execSync(`git status --short "${file}"`).toString().trim();
                  const commitCount = execSync(`git rev-list --count HEAD -- "${file}"`).toString().trim();
                  if (status.startsWith("A") || status.startsWith("??") || commitCount === "1") {
                    isNewFile = true;
                  }
                } catch(e) {}

                const badgeText = isNewFile ? "New!" : "Update!";
                const badgeColor = isNewFile ? "yellow" : "green";

                // Regex yang lebih luas: Mencari blok objek yang mengandung ${cleanName} ATAU URL yang berakhiran /${cleanName}
                const regexBlock = new RegExp(`(\\{[\\s\\S]*?(?:${cleanName}|\\/${cleanName})[\\s\\S]*?\\})`, "g");

                loaderContent = loaderContent.replace(regexBlock, (match) => {
                  modified = true;
                  let block = match;

                  if (/UpdateTimestamp\s*=\s*"[^"]*"/.test(block)) {
                    block = block.replace(/UpdateTimestamp\s*=\s*"[^"]*"/, `UpdateTimestamp = "${featureTimeStr}"`);
                  } else {
                    block = block.replace(/(\{)/, `$1\n        UpdateTimestamp = "${featureTimeStr}",`);
                  }

                  if (/BadgeText\s*=\s*"[^"]*"/.test(block)) {
                    block = block.replace(/BadgeText\s*=\s*"[^"]*"/, `BadgeText = "${badgeText}"`);
                  } else {
                    block = block.replace(/(\{)/, `$1\n        BadgeText = "${badgeText}",`);
                  }

                  if (/BadgeColor\s*=\s*"[^"]*"/.test(block)) {
                    block = block.replace(/BadgeColor\s*=\s*"[^"]*"/, `BadgeColor = "${badgeColor}"`);
                  } else {
                    block = block.replace(/(\{)/, `$1\n        BadgeColor = "${badgeColor}",`);
                  }

                  console.log(`-> Berhasil update otomatis badge & timestamp untuk: ${cleanName}`);
                  return block;
                });
              }
            });

            if (modified) {
              fs.writeFileSync("Loader.lua", loaderContent);
            }
          '

      # 2. STEP COMMIT & PUSH OTOMATIS KE GITHUB
      - name: Commit & Push Loader Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Loader.lua
          git diff --quiet && git diff --staged --quiet || (git commit -m "bot: auto update dynamic timestamps & badges" && git push)

      # 3. STEP KIRIM LAST UPDATE KE GOOGLE SHEETS
      - name: Send Timestamp to Google Sheets
        run: |
          CURRENT_TIME=$(TZ='Asia/Jakarta' date +'%d%m%Y %H:%M')
          curl -X POST -H "Content-Type: application/json" \
          -d "{\"Type\":\"LastUpdate\",\"Timestamp\":\"$CURRENT_TIME\"}" \
          "https://script.google.com/macros/s/AKfycbxJzU3MiL_o9PjkF4h-prSw-P8vLVfJqGFXM7pFJOPzIzJXaGmu6z6oK0oJl54a6bQy0Q/exec"
          
