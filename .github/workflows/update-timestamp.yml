name: Auto Update Hub Metadata & Timestamps (Precise Block Parser)

on:
  push:
    branches:
      - main

jobs:
  update-metadata-and-sheets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository with History
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # 1. STEP PARSER PRESISI: UPDATE SEMUA BLOK FITUR BERDASARKAN RAWURL
      - name: Process Precise RawUrl Block Parsing & Badges
        run: |
          node -e '
            const fs = require("fs");
            const { execSync } = require("child_process");

            let changedFiles = [];
            try {
              changedFiles = execSync("git diff-tree --no-commit-id --name-only -r HEAD")
                .toString()
                .trim()
                .split("\n");
            } catch (e) {
              process.exit(0);
            }

            if (!changedFiles.length || (changedFiles.length === 1 && changedFiles[0] === "")) {
              console.log("Tidak ada perubahan file.");
              process.exit(0);
            }

            const now = new Date();
            now.setHours(now.getHours() + 7);
            const pad = (n) => String(n).padStart(2, "0");
            const dd = pad(now.getDate());
            const mm = pad(now.getMonth() + 1);
            const yyyy = now.getFullYear();
            const hh = pad(now.getHours());
            const min = pad(now.getMinutes());
            const featureTimeStr = `${dd}${mm}${yyyy}${hh}${min}, 86400`;

            let loaderContent = fs.readFileSync("Loader.lua", "utf8");
            let modified = false;

            changedFiles.forEach((file) => {
              if (file === "Loader.lua" || file.includes("update.yml")) return;

              if (file.endsWith(".lua") || !file.includes(".")) {
                const rawName = file.split("/").pop();
                const cleanName = rawName.replace(".lua", "");

                console.log(`\n🔍 Memproses file: ${cleanName}`);

                let isNewFeature = false;
                try {
                  const diffLine = execSync(`git log -p -1 -U1 -- "${file}"`).toString();
                  if (diffLine.includes("+") && (diffLine.includes("RawUrl") || execSync(`git status --short "${file}"`).toString().includes("A"))) {
                    isNewFeature = true;
                  }
                } catch(e) {}

                const badgeText = isNewFeature ? "New!" : "Update!";
                const badgeColor = isNewFeature ? "yellow" : "green";
                console.log(`-> Badge: ${badgeText}, Warna: ${badgeColor}`);

                // 🎯 METODE PARSER PRESISI: Cari semua titik yang memiliki RawUrl berakhiran /${cleanName}
                let pos = 0;
                while (true) {
                  const regexUrl = new RegExp(`RawUrl\\s*=\\s*"[^"]*\\/${cleanName}"`, "g");
                  regexUrl.lastIndex = pos;
                  const match = regexUrl.exec(loaderContent);
                  if (!match) break;

                  const urlIndex = match.index;
                  pos = urlIndex + match[0].length;

                  // Lacak kurung kurawal buka { mundur ke belakang dari posisi RawUrl
                  let braceCount = 0;
                  let blockStart = -1;
                  for (let i = urlIndex; i >= 0; i--) {
                    if (loaderContent[i] === "}") braceCount++;
                    if (loaderContent[i] === "{") {
                      if (braceCount > 0) {
                        braceCount--;
                      } else {
                        blockStart = i;
                        break;
                      }
                    }
                  }

                  // Lacak kurung kurawal tutup } maju ke depan dari posisi RawUrl
                  braceCount = 0;
                  let blockEnd = -1;
                  for (let i = urlIndex; i < loaderContent.length; i++) {
                    if (loaderContent[i] === "{") braceCount++;
                    if (loaderContent[i] === "}") {
                      if (braceCount > 0) {
                        braceCount--;
                      } else {
                        blockEnd = i;
                        break;
                      }
                    }
                  }

                  if (blockStart !== -1 && blockEnd !== -1) {
                    let block = loaderContent.substring(blockStart, blockEnd + 1);
                    let newBlock = block;

                    // Fungsi pembantu untuk update atau insert properti di dalam blok
                    function upsertProp(content, propName, propVal) {
                      const propRegex = new RegExp(`${propName}\\s*=\\s*"[^"]*"`);
                      if (propRegex.test(content)) {
                        return content.replace(propRegex, `${propName} = "${propVal}"`);
                      } else {
                        // Jika belum ada, masukkan di bawah kurung kurawal buka {
                        return content.replace(/(\{)/, `$1\n            ${propName} = "${propVal}",`);
                      }
                    }

                    newBlock = upsertProp(newBlock, "UpdateTimestamp", featureTimeStr);
                    newBlock = upsertProp(newBlock, "BadgeText", badgeText);
                    newBlock = upsertProp(newBlock, "BadgeColor", badgeColor);

                    if (newBlock !== block) {
                      loaderContent = loaderContent.substring(0, blockStart) + newBlock + loaderContent.substring(blockEnd + 1);
                      modified = true;
                      pos = blockStart + newBlock.length;
                      console.log(`   ✔️ Berhasil update lengkap (Timestamp & Badge) untuk blok ${cleanName}`);
                    }
                  }
                }
              }
            });

            if (modified) {
              fs.writeFileSync("Loader.lua", loaderContent);
              console.log("\n💾 Loader.lua berhasil disimpan ulang!");
            }
          '

      # 2. STEP COMMIT & PUSH OTOMATIS KE GITHUB
      - name: Commit & Push Loader Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Loader.lua
          git diff --quiet && git diff --staged --quiet || (git commit -m "bot: precise block parser update timestamps & badges" && git push)

      # 3. STEP KIRIM LAST UPDATE KE GOOGLE SHEETS
      - name: Send Timestamp to Google Sheets
        run: |
          CURRENT_TIME=$(TZ='Asia/Jakarta' date +'%d%m%Y %H:%M')
          curl -X POST -H "Content-Type: application/json" \
          -d "{\"Type\":\"LastUpdate\",\"Timestamp\":\"$CURRENT_TIME\"}" \
          "https://script.google.com/macros/s/AKfycbxJzU3MiL_o9PjkF4h-prSw-P8vLVfJqGFXM7pFJOPzIzJXaGmu6z6oK0oJl54a6bQy0Q/exec"
          
