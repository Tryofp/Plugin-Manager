name: Auto Update Hub Metadata & Timestamps (Smart RawUrl Matcher)

on:
  push:
    branches:
      - main

jobs:
  update-metadata-and-sheets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository with History
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # 1. STEP CERDAS: COCOKAN BERDASARKAN RAWURL DI LOADER.LUA
      - name: Process Smart RawUrl Matching & Badge Updates
        run: |
          node -e '
            const fs = require("fs");
            const { execSync } = require("child_process");

            let changedFiles = [];
            try {
              // Ambil daftar file yang berubah pada commit terakhir
              changedFiles = execSync("git diff-tree --no-commit-id --name-only -r HEAD")
                .toString()
                .trim()
                .split("\n");
            } catch (e) {
              process.exit(0);
            }

            if (!changedFiles.length || (changedFiles.length === 1 && changedFiles[0] === "")) {
              console.log("Tidak ada perubahan file.");
              process.exit(0);
            }

            // Format Waktu WIB (UTC+7)
            const now = new Date();
            now.setHours(now.getHours() + 7);
            const pad = (n) => String(n).padStart(2, "0");
            const dd = pad(now.getDate());
            const mm = pad(now.getMonth() + 1);
            const yyyy = now.getFullYear();
            const hh = pad(now.getHours());
            const min = pad(now.getMinutes());
            const featureTimeStr = `${dd}${mm}${yyyy}${hh}${min}, 86400`;

            let loaderContent = fs.readFileSync("Loader.lua", "utf8");
            let modified = false;

            changedFiles.forEach((file) => {
              // Abaikan jika yang di-push adalah Loader.lua sendiri atau update.yml
              if (file === "Loader.lua" || file.includes("update.yml")) return;

              if (file.endsWith(".lua") || !file.includes(".")) {
                // Ambil nama file bersih tanpa ekstensi (contoh: "SoundandView" dari "Plugin/SoundandView.lua")
                const rawName = file.split("/").pop();
                const cleanName = rawName.replace(".lua", "");

                console.log(`\n🔍 Menganalisis file yang diubah: ${cleanName}`);

                // Logika Deteksi New! vs Update! sesuai ide bro Tryo:
                // Cek apakah baris RawUrl yang memuat nama file ini baru ditambahkan di commit ini (New) atau sudah ada sebelumnya (Update)
                let isNewFeature = false;
                try {
                  const diffLine = execSync(`git log -p -1 -U1 -- "${file}"`).toString();
                  // Jika di commit ini ada penambahan baris RawUrl atau file benar-benar baru
                  if (diffLine.includes("+") && (diffLine.includes("RawUrl") || execSync(`git status --short "${file}"`).toString().includes("A"))) {
                    isNewFeature = true;
                  }
                } catch(e) {}

                const badgeText = isNewFeature ? "New!" : "Update!";
                const badgeColor = isNewFeature ? "yellow" : "green";
                console.log(`-> Status Badge terpilih: ${badgeText} (${badgeColor})`);

                // 🎯 INI INTI LOGIKANYA: Cari blok {} di Loader.lua yang di dalamnya ada RawUrl berakhiran /${cleanName} atau memuat nama file tersebut
                // Ini membuat bot langsung fokus ke objek/fitur yang tepat tanpa merembet ke mana-mana
                const escapedName = cleanName.replace(/[-\/\\^$*+?.()|[\]{}]/g, "\\$&");
                
                // Regex mencakup blok kurung kurawal {} yang memiliki teks mengarah ke file tersebut
                const regexBlock = new RegExp(`(\\{[\\s\\S]*?(?:RawUrl\\s*=\\s*"[^"]*\\/${escapedName}|${escapedName})[\\s\\S]*?\\})`, "g");

                let matchCount = 0;
                loaderContent = loaderContent.replace(regexBlock, (match) => {
                  modified = true;
                  matchCount++;
                  let block = match;

                  // Update atau Tambah UpdateTimestamp
                  if (/UpdateTimestamp\s*=\s*"[^"]*"/.test(block)) {
                    block = block.replace(/UpdateTimestamp\s*=\s*"[^"]*"/, `UpdateTimestamp = "${featureTimeStr}"`);
                  } else {
                    block = block.replace(/(\{)/, `$1\n        UpdateTimestamp = "${featureTimeStr}",`);
                  }

                  // Update atau Tambah BadgeText
                  if (/BadgeText\s*=\s*"[^"]*"/.test(block)) {
                    block = block.replace(/BadgeText\s*=\s*"[^"]*"/, `BadgeText = "${badgeText}"`);
                  } else {
                    block = block.replace(/(\{)/, `$1\n        BadgeText = "${badgeText}",`);
                  }

                  // Update atau Tambah BadgeColor
                  if (/BadgeColor\s*=\s*"[^"]*"/.test(block)) {
                    block = block.replace(/BadgeColor\s*=\s*"[^"]*"/, `BadgeColor = "${badgeColor}"`);
                  } else {
                    block = block.replace(/(\{)/, `$1\n        BadgeColor = "${badgeColor}",`);
                  }

                  console.log(`   ✔️ Berhasil memperbarui blok fitur ke-${matchCount} untuk ${cleanName}`);
                  return block;
                });

                if (matchCount === 0) {
                  console.log(`   ⚠️ Peringatan: Tidak ditemukan blok RawUrl yang cocok dengan "${cleanName}" di Loader.lua. Pastikan penulisannya sinkron!`);
                }
              }
            });

            if (modified) {
              fs.writeFileSync("Loader.lua", loaderContent);
              console.log("\n💾 Loader.lua berhasil disimpan ulang dengan timestamp baru!");
            }
          '

      # 2. STEP COMMIT & PUSH OTOMATIS KE GITHUB
      - name: Commit & Push Loader Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Loader.lua
          git diff --quiet && git diff --staged --quiet || (git commit -m "bot: smart auto update timestamps & badges via RawUrl" && git push)

      # 3. STEP KIRIM LAST UPDATE KE GOOGLE SHEETS
      - name: Send Timestamp to Google Sheets
        run: |
          CURRENT_TIME=$(TZ='Asia/Jakarta' date +'%d%m%Y %H:%M')
          curl -X POST -H "Content-Type: application/json" \
          -d "{\"Type\":\"LastUpdate\",\"Timestamp\":\"$CURRENT_TIME\"}" \
          "https://script.google.com/macros/s/AKfycbxJzU3MiL_o9PjkF4h-prSw-P8vLVfJqGFXM7pFJOPzIzJXaGmu6z6oK0oJl54a6bQy0Q/exec"
          
